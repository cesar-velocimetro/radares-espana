name: Generar Base de Datos de Radares

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Descargar extracto de Iberia y filtrar radares
        run: |
          SUB="download"
          DOM="geofabrik.de"
          RUTA="europe/iberia-latest.osm.pbf"
          curl -fL --retry 5 --retry-delay 10 --connect-timeout 30 "https://${SUB}.${DOM}/${RUTA}" -o iberia-latest.osm.pbf
          osmium tags-filter iberia-latest.osm.pbf n/highway=speed_camera n/enforcement=traffic_signals n/enforcement=stop r/enforcement=average_speed r/enforcement=traffic_signals r/enforcement=maxspeed r/enforcement=stop -o radares_iberia.osm.pbf
          osmium export radares_iberia.osm.pbf -o radares_osm.geojson
          rm iberia-latest.osm.pbf radares_iberia.osm.pbf

      - name: Ejecutar fusión y deduplicación
        run: |
          python fusionar_radares.py
          rm radares_osm.geojson

      - name: Guardar radares_unificados.json en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add radares_unificados.json
          git commit -m "Actualización automática de radares Iberia" || exit 0
          git push
