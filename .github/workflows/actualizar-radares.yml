name: Generar Base de Datos de Radares

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar osmium-tool
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Descargar extractos de Iberia y filtrar radares
        run: |
          SUB="download"
          DOM="geofabrik.de"
          FILTROS="n/highway=speed_camera n/enforcement=traffic_signals n/enforcement=stop r/enforcement=average_speed r/enforcement=traffic_signals r/enforcement=maxspeed r/enforcement=stop"
          
          for PAIS in spain portugal andorra; do
            curl -fL --retry 5 --retry-delay 10 --connect-timeout 30 "https://${SUB}.${DOM}/europe/${PAIS}-latest.osm.pbf" -o "${PAIS}.osm.pbf"
            osmium tags-filter "${PAIS}.osm.pbf" ${FILTROS} -o "rad_${PAIS}.osm.pbf"
            rm "${PAIS}.osm.pbf"
          done
          
          osmium merge rad_spain.osm.pbf rad_portugal.osm.pbf rad_andorra.osm.pbf -o radares_iberia.osm.pbf
          osmium export radares_iberia.osm.pbf -o radares_osm.geojson
          rm rad_*.osm.pbf radares_iberia.osm.pbf

      - name: Ejecutar fusión y deduplicación
        run: |
          python fusionar_radares.py
          rm radares_osm.geojson

      - name: Guardar radares_unificados.json en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radares_unificados.json
          git commit -m "Actualización automática de radares Iberia" || exit 0
          git pull --rebase --autostash origin main
          git push

      - name: Limpiar ejecuciones antiguas de Actions
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
